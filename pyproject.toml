[project]
name = "dlc"
version = "0.1.0"
description = "DeepLabCut environment managed by uv"
requires-python = "==3.10.*"
dependencies = [
    "ipython",
    "jupyter",
    "notebook<7.0.0",
    "tables==3.8.0",
    "h5py",
    "plotly",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "deeplabcut[gui,modelzoo,wandb]==3.0.0rc8",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
